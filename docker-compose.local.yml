services:
  keycloak:
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command:
      - "start-dev"
      - "--import-realm"

  api-gateway:
    container_name: wacchat-api-gateway
    build:
      context: ./wac/api-gateway
      dockerfile: Dockerfile
    ports:
      - 8081:8081
    environment:
      # backend, file-service, notification-service and call-service still run
      # on the host via ./mvnw spring-boot:run in local dev — reach them
      # through the Docker-provided host gateway.
      BACKEND_BASE_URL: http://host.docker.internal:8082
      FILE_SERVICE_BASE_URL: http://host.docker.internal:8083
      NOTIFICATION_SERVICE_BASE_URL: http://host.docker.internal:8084
      CALL_SERVICE_BASE_URL: http://host.docker.internal:8085
      OTLP_TRACING_ENDPOINT: http://wacchat-tempo:4318/v1/traces
      LOKI_URL: http://wacchat-loki:3100/loki/api/v1/push
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wacchat
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
