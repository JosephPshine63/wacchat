name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Full deploy (restarts the whole stack incl. Keycloak/RabbitMQ) instead of only the changed services'
        type: boolean
        default: false

jobs:
  backend-services:
    name: Build & test (Java modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install shared-security to local repo
        working-directory: wac/shared-security
        run: ./mvnw -B install -DskipTests

      - name: Build & test backend
        working-directory: wac/backend
        # WacchatApiApplicationTests boots the full Spring context (Postgres/Keycloak/RabbitMQ
        # required) — excluded here since CI has no such infra; the rest are real unit tests.
        run: ./mvnw -B clean test -Dtest='!WacchatApiApplicationTests'

      - name: Build & test api-gateway
        working-directory: wac/api-gateway
        run: ./mvnw -B clean test

      - name: Build & test file-service
        working-directory: wac/file-service
        run: ./mvnw -B clean test

      - name: Build & test notification-service
        working-directory: wac/notification-service
        run: ./mvnw -B clean test

      - name: Build & test call-service
        working-directory: wac/call-service
        run: ./mvnw -B clean test

  frontend:
    name: Build & test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wac/frontend/package-lock.json

      - name: Install dependencies
        working-directory: wac/frontend
        run: npm ci

      - name: Check i18n dictionaries (key parity, placeholders, keys used in code)
        working-directory: wac/frontend
        run: npm run i18n:check

      - name: Run unit tests (headless Chrome)
        working-directory: wac/frontend
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

      - name: Production build
        working-directory: wac/frontend
        run: npm run build

  # Deploys to production on every green push to main (and on a manual run of this workflow
  # from main). The server-side logic — which services changed, health checks, rollback —
  # lives in ci-deploy.sh so it can be read and run by hand.
  deploy:
    name: Deploy to production
    needs: [backend-services, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_FLAG: ${{ inputs.full && '--full' || '' }}
      HAS_DEPLOY_SECRETS: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_CLIENT_SECRET != '' && secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      # Until the three secrets exist the job is skipped with a warning instead of failing every push.
      - name: Check deploy secrets
        if: env.HAS_DEPLOY_SECRETS != 'true'
        run: echo "::warning::Deploy skipped — set TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET and DEPLOY_SSH_KEY in the repository secrets."

      - name: Connect to Tailscale
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Add deploy SSH key
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ci-deploy.sh is pulled with the code, so the checkout is updated here first and the
      # previous commit is handed to the script (it diffs PREV..HEAD to pick the services).
      - name: Deploy over SSH
        if: env.HAS_DEPLOY_SECRETS == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new gpr-server@gpr-server bash -s -- "$DEPLOY_FLAG" <<'REMOTE'
          set -euo pipefail
          cd ~/Applications/connecting
          [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ] || { echo "server checkout is not on main"; exit 1; }
          PREV=$(git rev-parse HEAD)
          git pull --ff-only
          bash ci-deploy.sh "$PREV" "$@"
          REMOTE
