# Italian source for the custom login theme (hand-edited). Other languages are generated with DeepL
# (frontend: npm run i18n:translate -- --bundle=keycloak). Standard Keycloak texts (login, password,
# errors…) come from the parent theme's own translations. Keycloak formats messages with MessageFormat,
# so a literal apostrophe is written as '' in these files.
wacOr=oppure
wacDisclaimer=App dimostrativa per uso personale — non inserire dati personali reali. Gli account inattivi vengono eliminati automaticamente dopo 2 mesi.
wacPrivacyLink=Privacy e termini
wacResetIntro=Inserisci l''email con cui hai effettuato l''accesso a WacChat: ti invieremo un link per reimpostare la password.
wacResetWarning=<strong>Attenzione:</strong> non è lo username della chat (quello con la @ mostrato agli altri utenti), ma l''email dell''account di accesso.
wacResetEmailLabel=Email di accesso
wacTermsTab=Termini e condizioni — WacChat
