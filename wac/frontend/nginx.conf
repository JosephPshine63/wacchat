# `/` serves one of two pages depending on the wac_app cookie (set by /enter, i.e. the landing's
# "Accedi" button): visitors without it — crawlers included — get the static, indexable landing
# page (built by landing/build.mjs); visitors with it get the Angular app. Keycloak's
# login-required flow means the app itself has nothing for a crawler to index.
map $cookie_wac_app $entry_page {
    "1"     /index.html;
    default /landing/index.html;
}
# The app shell must never be indexed; an empty value makes add_header skip the header.
map $cookie_wac_app $entry_robots {
    "1"     "noindex";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    # Behind a TLS-terminating proxy nginx would otherwise emit http:// redirect targets.
    absolute_redirect off;

    # add_header is not inherited into a location that declares its own, so every such
    # location includes this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    location = / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie" always;
        add_header X-Robots-Tag $entry_robots;
        try_files $entry_page =404;
    }

    # Sets the cookie that switches / from the landing page to the app, then hands over to it.
    location = /enter {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Set-Cookie "wac_app=1; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex";
        return 302 /;
    }

    # The Italian landing page is only reachable through `/`; /landing/... must not be a second public URL.
    location ^~ /landing/ {
        return 404;
    }

    # App shell: also the SPA fallback for unknown paths, so it is never indexable.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let browsers cache the service worker script itself — a stale cached sw.js
    # would silently block push/notificationclick fixes from ever reaching returning users.
    location = /sw.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Build stamp written by deploy-prod.sh — must always reflect the running image.
    location = /version.json {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://wacchat-api-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Default 60s timeouts/HTTP 1.0 upstream are fine for normal API calls but too tight
        # for large media uploads (video) on real-world connections vs. instant localhost dev.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    location /ws {
        proxy_pass http://wacchat-api-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
