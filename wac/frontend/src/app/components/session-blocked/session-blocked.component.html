<div class="session-blocked-overlay">
  <div class="session-blocked-box">
    <div class="modal-lang"><app-language-switcher></app-language-switcher></div>
    <div class="session-blocked-icon">
      <i class="fa-solid fa-user-lock"></i>
    </div>
    <h2 class="session-blocked-title">{{ 'sessionBlocked.title' | transloco }}</h2>
    <p class="session-blocked-sub">
      {{ 'sessionBlocked.text' | transloco }}
    </p>

    <button class="session-blocked-retry-btn" [disabled]="retrying" (click)="retry()">
      @if (retrying) {
        <i class="fa-solid fa-spinner fa-spin"></i> {{ 'sessionBlocked.checking' | transloco }}
      } @else {
        {{ 'sessionBlocked.retry' | transloco }}
      }
    </button>
    <button class="session-blocked-logout-btn" (click)="logout()">
      {{ 'common.logout' | transloco }}
    </button>
  </div>
</div>
