<div class="avatar-upload-overlay" (click)="close()">
  <div class="avatar-upload-box" (click)="$event.stopPropagation()">
    <button class="avatar-upload-close" (click)="close()" [attr.aria-label]="'common.close' | transloco">
      <i class="fas fa-xmark"></i>
    </button>

    <h2 class="avatar-upload-title">{{ 'avatarUpload.title' | transloco }}</h2>

    <div class="avatar-upload-preview">
      @if (mode === 'preview' && previewUrl) {
        <img [src]="previewUrl" alt="">
      } @else if (currentAvatarUrl) {
        <img [src]="currentAvatarUrl" alt="">
      } @else {
        <i class="fa-solid fa-user"></i>
      }
      @if (uploading) {
        <div class="avatar-upload-spinner">
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
      }
    </div>

    @if (errorMessage) {
      <p class="avatar-upload-error">{{ errorMessage }}</p>
    }

    <div class="avatar-upload-actions">
      @if (mode === 'preview') {
        <button class="avatar-upload-btn primary" (click)="confirmUpload()" [disabled]="uploading">
          {{ 'avatarUpload.use' | transloco }}
        </button>
        <button class="avatar-upload-btn danger" (click)="cancelPreview()" [disabled]="uploading">
          {{ 'common.cancel' | transloco }}
        </button>
      } @else {
        <button class="avatar-upload-btn primary" (click)="fileInput.click()" [disabled]="uploading">
          {{ 'avatarUpload.upload' | transloco }}
        </button>
        @if (currentAvatarUrl) {
          <button class="avatar-upload-btn danger" (click)="removeAvatar()" [disabled]="uploading">
            {{ 'avatarUpload.remove' | transloco }}
          </button>
        }
      }
    </div>

    <input
      #fileInput
      type="file"
      class="visually-hidden-file-input"
      accept=".jpg,.jpeg,.png,.webp"
      (change)="onFileSelected($event)"
    >
  </div>
</div>
