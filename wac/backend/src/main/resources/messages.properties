mail.welcome.body=Ciao {0},\n\nBenvenuto su WacChat! Sono Giuseppe Pio Ruocco, il creatore di questa app.\nL'ho realizzata puramente per passione, come hobby, ma anche per attrarre qualche occasione professionale.\nSpero possa piacerti ;)\n\nPuoi iniziare a chattare visitando https://wacchat.win\n\nSe vuoi contattarmi:\nEmail: dev.pioruocco@gmail.com\nLinkedIn: https://www.linkedin.com/in/giuseppe-pio-ruocco-7b4367267/\n\nA presto!
bot.welcome=Ciao! Sono Arno AI 🐦 il tuo assistente virtuale su WacChat. Sono qui se ti va di scambiare due chiacchiere o hai bisogno di una mano, scrivimi pure!\n\nDue parole su come funziona l'app:\n• Chat singole e di gruppo, con messaggi di testo e invio di foto/media\n• Chiamate audio e video, sia 1 a 1 che di gruppo\n• Puoi personalizzare tema colori e sfondo delle chat da Impostazioni\n• Le notifiche desktop ti avvisano dei nuovi messaggi quando la chat non è aperta\n\nVuoi un'icona sulla schermata home come una vera app?\n• iPhone (Safari): tocca l'icona di condivisione (il quadrato con la freccia) e scegli "Aggiungi a Home"\n• Android (Chrome): apri il menu (⋮ in alto a destra) e scegli "Aggiungi a schermata Home"\n\nPs: questa è un'app sviluppata per hobby, dopo 2 mesi di inattività tutti i dati dell'utente corrente verranno cancellati.
bot.fallback=Scusa, in questo momento ho qualche difficoltà a rispondere. Riprova tra poco!
admin.welcome=Ciao! Questa è la chat diretta con l'amministratore di WacChat. Scrivimi pure se trovi un bug, hai un problema o vuoi segnalarmi qualcosa 🙂
