mail.welcome.subject=¡Bienvenido a WacChat!
mail.welcome.body=Hola, {0},\n\n¡Bienvenido a WacChat! Soy Giuseppe Pio Ruocco, el creador de esta app.\nLa he hecho solo por pasión, como hobby, pero también para que me surja alguna oportunidad profesional.\nEspero que te guste ;)\n\nPuedes empezar a chatear entrando en https://wacchat.win\n\nSi quieres ponerte en contacto conmigo:\nCorreo electrónico: dev.pioruocco@gmail.com\nLinkedIn: https://www.linkedin.com/in/giuseppe-pio-ruocco-7b4367267/\n\n¡Hasta pronto!
bot.welcome=¡Hola! Soy Arno AI 🐦, tu asistente virtual en WacChat. Estoy aquí por si te apetece charlar un rato o necesitas un poco de ayuda, ¡no dudes en escribirme!\n\nUnas palabras sobre cómo funciona la app:\n• Chats individuales y grupales, con mensajes de texto y envío de fotos y archivos multimedia\n• Llamadas de audio y vídeo, tanto individuales como en grupo\n• Puedes personalizar los colores y el fondo de los chats desde «Ajustes»\n• Las notificaciones en el escritorio te avisan de los mensajes nuevos cuando el chat no está abierto\n\n¿Quieres un icono en la pantalla de inicio como si fuera una app de verdad?\n• iPhone (Safari): toca el icono para compartir (el cuadrado con la flecha) y elige «Añadir a la pantalla de inicio»\n• Android (Chrome): abre el menú (⋮ arriba a la derecha) y selecciona «Añadir a la pantalla de inicio»\n\nP. D.: Esta es una app que he desarrollado por hobby; tras dos meses sin usarla, se borrarán todos los datos del usuario actual.
bot.fallback=Perdona, ahora mismo me cuesta un poco contestarte. ¡Inténtalo de nuevo dentro de un rato!
