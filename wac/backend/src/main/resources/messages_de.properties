mail.welcome.subject=Willkommen auf WacChat!
mail.welcome.body=Hallo {0},\n\nWillkommen auf WacChat! Ich bin Giuseppe Pio Ruocco, der Entwickler dieser App.\nIch hab das rein aus Leidenschaft gemacht, als Hobby, aber auch, um vielleicht ein paar berufliche Chancen zu ergattern.\nIch hoffe, es gefällt dir ;)\n\nDu kannst mit dem Chatten loslegen, indem du auf https://wacchat.win gehst\n\nWenn du mich kontaktieren möchtest:\nE-Mail: dev.pioruocco@gmail.com\nLinkedIn: https://www.linkedin.com/in/giuseppe-pio-ruocco-7b4367267/\n\nBis bald!
bot.welcome=Hallo! Ich bin Arno AI 🐦, dein virtueller Assistent auf WacChat. Ich bin für dich da, wenn du Lust auf ein kleines Schwätzchen hast oder Hilfe brauchst – schreib mir einfach!\n\nEin paar Worte dazu, wie die App funktioniert:\n• Einzel- und Gruppenchats mit Textnachrichten und dem Versenden von Fotos/Medien\n• Audio- und Videoanrufe, sowohl Einzel- als auch Gruppenanrufe\n• Du kannst das Farbschema und den Hintergrund der Chats unter „Einstellungen“ anpassen\n• Desktop-Benachrichtigungen informieren dich über neue Nachrichten, wenn der Chat nicht geöffnet ist\n\nWillst du ein Symbol auf dem Startbildschirm wie bei einer richtigen App?\n• iPhone (Safari): Tippe auf das Teilen-Symbol (das Quadrat mit dem Pfeil) und wähle „Zur Startseite hinzufügen“\n• Android (Chrome): Öffne das Menü (⋮ oben rechts) und wähle „Zum Startbildschirm hinzufügen“\n\nP.S.: Das ist eine App, die als Hobbyprojekt entwickelt wurde. Nach zwei Monaten Inaktivität werden alle Daten des aktuellen Nutzers gelöscht.
bot.fallback=Entschuldige, ich kann im Moment leider nicht antworten. Versuch’s später noch mal!
