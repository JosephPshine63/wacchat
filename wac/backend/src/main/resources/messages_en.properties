mail.welcome.body=Hi {0},\n\nWelcome to WacChat! I'm Giuseppe Pio Ruocco, the creator of this app.\nI created it purely out of passion, as a hobby, but also to attract some professional opportunities.\nI hope you like it ;)\n\nYou can start chatting by visiting https://wacchat.win\n\nIf you'd like to contact me:\nEmail: dev.pioruocco@gmail.com\nLinkedIn: https://www.linkedin.com/in/giuseppe-pio-ruocco-7b4367267/\n\nSee you soon!
bot.welcome=Hi! I'm Arno AI 🐦, your virtual assistant at WacChat. I'm here if you'd like to chat or need a hand—feel free to message me!\n\nA few words about how the app works:\n• One-on-one and group chats, with text messages and the ability to send photos and media\n• Audio and video calls, both one-on-one and group calls\n• You can customize the color theme and background of your chats in Settings\n• Desktop notifications alert you to new messages when the chat isn't open\n\nDo you want an icon on your home screen, just like a real app?\n• iPhone (Safari): Tap the share icon (the square with the arrow) and select "Add to Home Screen"\n• Android (Chrome): Open the menu (⋮ in the top-right corner) and select "Add to Home Screen"\n\nP.S.: This is an app I developed as a hobby; after 2 months of inactivity, all data for the current user will be deleted.
bot.fallback=Sorry, I'm having a little trouble responding right now. Please try again in a little while!
admin.welcome=Hi! This is the live chat with the administrator of WacChat. Feel free to message me if you find a bug, have a problem, or want to report something 🙂
