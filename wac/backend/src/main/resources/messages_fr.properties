mail.welcome.body=Salut {0},\n\nBienvenue sur WacChat ! Je m'appelle Giuseppe Pio Ruocco, je suis le créateur de cette appli.\nJe l'ai créée juste par passion, comme passe-temps, mais aussi pour attirer quelques opportunités professionnelles.\nJ'espère que ça te plaira ;)\n\nTu peux commencer à discuter en te rendant sur https://wacchat.win\n\nSi tu veux me contacter :\nE-mail : dev.pioruocco@gmail.com\nLinkedIn : https://www.linkedin.com/in/giuseppe-pio-ruocco-7b4367267/\n\nÀ bientôt !
bot.welcome=Salut ! Je suis Arno AI 🐦, ton assistant virtuel sur WacChat. Je suis là si tu as envie de discuter un peu ou si tu as besoin d'un coup de main, n'hésite pas à m'écrire !\n\nQuelques mots sur le fonctionnement de l'appli :\n• Discussions individuelles et en groupe, avec des messages texte et l'envoi de photos/fichiers multimédias\n• Appels audio et vidéo, en tête-à-tête ou en groupe\n• Tu peux personnaliser les couleurs et l'arrière-plan des discussions dans les Paramètres\n• Les notifications sur le bureau t'avertissent quand tu reçois de nouveaux messages, même si la fenêtre de discussion n'est pas ouverte\n\nTu veux une icône sur l'écran d'accueil, comme une vraie appli ?\n• iPhone (Safari) : appuie sur l'icône de partage (le carré avec la flèche) et choisis « Ajouter à l'écran d'accueil »\n• Android (Chrome) : ouvre le menu (⋮ en haut à droite) et sélectionne « Ajouter à l'écran d'accueil »\n\nP.S. : c'est une appli que j'ai développée pour le plaisir ; après 2 mois d'inactivité, toutes les données de l'utilisateur actuel seront supprimées.
bot.fallback=Désolé, j'ai un peu de mal à te répondre pour le moment. Réessaie dans un petit moment !
admin.welcome=Salut ! Voici le chat en direct avec l'administrateur de WacChat. N'hésite pas à m'écrire si tu trouves un bug, si tu as un problème ou si tu veux me signaler quelque chose 🙂
