server:
  port: 8082

spring:
  application:
    name: backend
  banner:
    location: classpath:banner/banner.txt
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wacchat_db}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:admin}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:admin}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  messages:
    basename: messages
    encoding: UTF-8
    # Italian is the base bundle (messages.properties); without this, a host whose system
    # locale is e.g. English would pick messages_en for requests that name no locale.
    fallback-to-system-locale: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_BACKEND_USER:${RABBITMQ_USER:wacchat}}
    password: ${RABBITMQ_BACKEND_PASSWORD:${RABBITMQ_PASSWORD:wacchat}}
  mail:
    host: smtp.resend.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/wacchat}
          audiences:
            - wacchat-app
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

springdoc:
  default-produces-media-type: application/json


application:
  keycloak:
    admin-url: ${KEYCLOAK_ADMIN_URL:http://keycloak-wacchat:8080}
    realm: wacchat
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  mail:
    from: ${MAIL_FROM:}
  cleanup:
    inactivity-days: 60
    protected-email: ${ADMIN_EMAIL:}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://localhost:8083}
    internal-api-key: ${FILE_SERVICE_INTERNAL_API_KEY:}
    connect-timeout-ms: 2000
    response-timeout-ms: 15000
  bot:
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      connect-timeout-ms: 2000
      response-timeout-ms: 15000
    arno:
      avatar-url: ${ARNO_AVATAR_URL:}
  admin:
    user-id: ${ADMIN_USER_ID:}
  session:
    stale-after-seconds: ${SESSION_STALE_SECONDS:120}
    max-active-sessions: ${SESSION_MAX_ACTIVE:3}
    internal-api-key: ${BACKEND_INTERNAL_API_KEY:}
  notification:
    exchange: wacchat.notifications
    routing-key: notification
    queue: wacchat.notifications.queue
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@wacchat.win}

resilience4j:
  circuitbreaker:
    instances:
      fileService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
      gemini:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      fileService:
        maxAttempts: 2
        waitDuration: 300ms
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
      gemini:
        maxAttempts: 2
        waitDuration: 300ms