name: wacchat

services:
  postgres:
    container_name: wacchat-db
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-wacchat_db}
    ports:
      - 127.0.0.1:5433:5432
    networks:
      - wacchat
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./wac/database/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    container_name: keycloak-wacchat
    image: quay.io/keycloak/keycloak:26.0.0
    ports:
      - 127.0.0.1:8180:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-gpradmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://auth.wacchat.win
      KC_HOSTNAME_STRICT: false
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: wacchat-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"   # /health/ready on the management port 9000 (not published), for the healthcheck below
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wacchat
    volumes:
      - ./wac/keycloak/realms:/opt/keycloak/data/import
      - ./wac/keycloak/themes:/opt/keycloak/themes
    command:
      - "start"
      - "--import-realm"
    healthcheck:
      # The image has no curl/wget: a raw HTTP request through bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  rabbitmq:
    container_name: wacchat-rabbitmq
    image: rabbitmq:3.13-management
    ports:
      - 127.0.0.1:5672:5672     # AMQP (publish/consume notification events) — Docker-internal only, no host access needed
      - 127.0.0.1:61613:61613   # STOMP (WebSocketConfig's broker relay in notification-service) — Docker-internal only
      - ${TAILSCALE_IP:-127.0.0.1}:15672:15672   # Management UI — bound to the Tailscale IP in prod (set in .env), loopback-only by default for local dev
    volumes:
      - ./wac/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./wac/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./wac/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - wacchat
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  wacchat:
    driver: bridge

volumes:
  postgres:
    driver: local
  rabbitmq:
    driver: local
